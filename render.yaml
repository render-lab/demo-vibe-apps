# The Render Dashboard will not create a Blueprint with no resources, so this
# file starts with one free static site. The factory rewrites this file from
# its app specs on the first run, which drops the placeholder from the
# Blueprint. Render then stops managing the site, and you can delete it.

services:
  - type: web
    runtime: static
    name: demo-vibe-apps-placeholder
    staticPublishPath: ./placeholder
